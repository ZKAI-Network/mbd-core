[bumpversion]
current_version = 0.1.2
commit = True
tag = True

[bumpversion:file:setup.py]
search = version="{current_version}" + FROZEN_VERSION
replace = version="{new_version}" + FROZEN_VERSION

[bumpversion:file:mbd_core/__init__.py]
search = __version__ = "{current_version}"
replace = __version__ = "{new_version}"
